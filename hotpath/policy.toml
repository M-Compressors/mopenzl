# Docs: https://hotpath.rs/regression_policy
# Use the same regression thresholds as the sibling mbrotli repository.

[functions]
min_percent_total = 0.05

[functions.icount]
judged = true
min_percent_change = 0.5
metrics = ["avg", "total"]
min_calls = 1

[functions.alloc]
judged = true
min_percent_change = 1
metrics = ["avg", "total"]
min_calls = 1

# Native timing on shared runners is informational.
[functions.timing]
judged = false
min_percent_change = 50
metrics = ["avg", "total"]
min_calls = 1
