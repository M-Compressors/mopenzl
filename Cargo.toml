[package]
name = "mopenzl"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "OpenZL compression and decompression in safe Rust; encoding is byte-identical to Meta's reference library"
repository = "https://github.com/M-Compressors/mopenzl"
homepage = "https://github.com/M-Compressors/mopenzl"
documentation = "https://docs.rs/mopenzl"
readme = "README.md"
keywords = ["openzl", "compression", "zstd", "simd"]
categories = ["compression", "algorithms", "no-std"]
exclude = [
    ".github/**",
    ".clusterfuzzlite/**",
    "architecture/**",
    "benchmarks/**",
    "docs/**",
    "fuzz/**",
    "hotpath/**",
    "openzl-ffi/**",
    "scripts/**",
    "target/**",
]

[dependencies.fearless_simd]
version = "1"
optional = true
default-features = false

# The Zstandard backend every OpenZL frame of the default graph carries. It is
# a safe-Rust implementation whose encoder is byte-identical to zstd 1.5.7,
# the version OpenZL v0.3.0 vendors.
[dependencies.mzstd]
version = "0.2.11"
optional = true
default-features = false

# Safe bookkeeping for uninitialized destinations: the filled prefix of a
# `MaybeUninit` slice is readable without `unsafe` in this crate.
[dependencies.borrowed-buf]
version = "0.1.1"
optional = true
default-features = false

[dependencies.thiserror]
version = "2"
optional = true
default-features = false

# Profiling instrumentation only. Optional so an ordinary dependant never pulls
# the proc-macro crate into its tree; every anchor in `src/` is written as
# `#[cfg_attr(all(feature = "hotpath", not(feature = "no_std")), hotpath::measure)]`.
[dependencies.hotpath]
version = "0.31.0"
optional = true

[dev-dependencies]
tempfile = "3.27"

# Retain the independent scalar oracle only for development builds.
[dev-dependencies.fearless_simd]
version = "1"
default-features = false
features = ["force_support_fallback", "std"]

[dev-dependencies.criterion]
version = "0.8"

[dev-dependencies.openzl-ffi]
path = "openzl-ffi"

# Decoder unit tests build raw Zstandard frames in every feature profile.
[dev-dependencies.mzstd]
version = "0.2.11"
default-features = false
features = ["compression", "decompression", "std"]

[features]
default = ["std", "compression", "decompression", "zstd"]
# Independently selectable public codecs and their private implementations.
compression = ["dep:borrowed-buf", "dep:fearless_simd", "dep:thiserror", "mzstd?/compression"]
decompression = ["dep:borrowed-buf", "dep:fearless_simd", "dep:thiserror", "mzstd?/decompression"]

# Codecs of the OpenZL graph, one feature each, all enabled by default. A
# disabled codec is never written by the encoder (a chunk that would use it
# is stored instead, so frames stop matching the reference's default graph)
# and decodes as `Unsupported`.
#
# Zstandard (`ZL_StandardTransformID_zstd`), the default graph's backend,
# through the safe-Rust `mzstd`.
zstd = ["dep:mzstd"]
# Standard library support: `std::io` adapters, `std::error::Error` and
# runtime SIMD detection.
std = ["fearless_simd?/std", "thiserror?/std", "mzstd?/std"]
# Opt-in alloc-backed support; overrides std-only APIs and instrumentation.
# Disable default features too when targeting a platform without std.
no_std = ["fearless_simd?/libm", "mzstd?/no_std"]

# `hotpath` turns the measurement anchors on; the mode features add a sampling
# mode on top of it, so each implies `hotpath` rather than standing alone with
# an inert runtime.
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[workspace]
members = ["openzl-ffi"]
# The fuzz packages pull in AFL's and libFuzzer's runtimes; keeping them out of
# the workspace leaves `cargo test` and `cargo clippy` unaffected by them.
exclude = ["fuzz/afl", "fuzz/libfuzzer"]
resolver = "3"

[[bench]]
name = "compress"
harness = false
required-features = ["compression"]

[[bench]]
name = "decompress"
harness = false
required-features = ["compression", "decompression"]

[[example]]
name = "compress"
required-features = ["compression", "decompression"]
