name: CI AddressSanitizer

# Run for every pushed tag, or on demand from Actions / the GitHub CLI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  simd:
    name: SIMD kernels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
      # The modules Miri checks, natively on every backend the runner
      # supports, AVX-512 included, plus the tests that compare with C.
      - run: python3 scripts/check_simd_uninit.py asan

  address-sanitizer:
    name: address sanitizer
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
      # Every unit and integration test. LeakSanitizer runs with ASan on
      # Linux.
      - run: cargo test --release --locked --target x86_64-unknown-linux-gnu --lib --tests
