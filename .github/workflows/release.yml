name: Release

# Run by hand: pick a `v*` tag in "Use workflow from". The crate is published
# through crates.io trusted publishing, so no API token is stored; the job
# exchanges its GitHub OIDC identity for a short-lived crates.io token. Only
# `mopenzl` is published; `openzl-ffi` is `publish = false`.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    name: publish mopenzl to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: require a release tag
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        run: |
          echo "::error::Run this workflow from a v* tag, not '$GITHUB_REF_NAME'."
          exit 1
      - uses: actions/checkout@v7
        with:
          # `cargo publish` verifies the package by building it, and the dev
          # dependency on openzl-ffi is resolved from the workspace.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: check the tag matches the package version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mopenzl") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mopenzl $version."
            exit 1
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --package mopenzl --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
