version: 2

# Not covered on purpose:
# - `openzl-ffi/vendor/{openzl,zstd,lz4}` (git submodules): they are the
#   pinned OpenZL v0.3.0 reference the encoder is byte-identical to and the
#   zstd/lz4 it vendors, so they move only in a deliberate vendor update.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # Excluded from the workspace, so it has its own lockfile.
  - package-ecosystem: cargo
    directory: /fuzz/afl
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # `afl` must stay on the release line of the `cargo-afl` that CI installs
      # (`--version 0.18.2`); bump both together by hand.
      - dependency-name: afl
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      fuzz-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /fuzz/libfuzzer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      libfuzzer-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
