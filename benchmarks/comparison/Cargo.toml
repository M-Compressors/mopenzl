[package]
name = "mopenzl-comparison"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "mopenzl against OpenZL v0.3.0 C on the Silesia corpus, one standard graph at a time"

# A separate workspace keeps the comparison's artifacts and lockfile out of
# the library's own checks.
[workspace]

[dependencies]
mopenzl = { path = "../.." }
openzl-ffi = { path = "../../openzl-ffi" }
hotpath = { version = "0.31.0", optional = true }

[features]
# Turns on the library's `hotpath` anchors for `profile` runs.
hotpath = ["dep:hotpath", "hotpath/hotpath", "mopenzl/hotpath"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu", "mopenzl/hotpath-cpu"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "mopenzl/hotpath-alloc"]

[profile.release]
debug = "line-tables-only"

[profile.profiling]
inherits = "release"
debug = true
